name: GodDataX
options:
  bundleIdPrefix: com.goddatax
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    PRODUCT_NAME: GodDataX
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  GodDataX:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: GodDataX
        excludes:
          - "Info.plist"
    info:
      path: GodDataX/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goddatax.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: GodDataX/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  GodDataX:
    build:
      targets:
        GodDataX: all

name: Build GodDataX IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodDataX_v2_OB56
          path: GodDataX_v2_OB56.ipa
          if-no-files-found: error

      - name: Publish Direct IPA Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: GodDataX IOS OB56 Latest
          files: |
            GodDataX_v2_OB56.ipa
            GodDataX_OB56_v2.ipa
            GodDataX_v4_OB56.ipa
            GodDataX_v3_OB56.ipa
            GodDataX_IOS_OB56.ipa
            GodDataX_Build205.ipa
            GodDataX_Build206.ipa
            GodDataX_Build207.ipa
            GodDataX_Build208.ipa
            GodDataX_Build209.ipa
            GodDataX_Build210.ipa
            GodDataX_Build211.ipa
            GodDataX_Build212.ipa
            GodDataX_Build213.ipa
            GodDataX_Build214.ipa
            GodDataX_Build215.ipa
            GodDataX_Build216.ipa
            GodDataX_Build217.ipa
            GodDataX_Build218.ipa
            GodDataX_OB56_Build218.ipa
            GodDataX_OB56_Build219.ipa
            GodDataX_OB56_Build220.ipa
            GodDataX_OB56_Build221.ipa
            GodDataX_OB56_Build222.ipa
            GodDataX_OB56_Build223.ipa
            GodDataX_Build223_Animated.ipa
            GodDataX_Build223_Smooth.ipa
            GodDataX_Build222_AntiBan.ipa
            GodDataX_Build222_Native.ipa
            GodDataX_OB56_Secured_v7.ipa
            GodDataX_Build221_Protected.ipa
            GodDataX_OB56_TouchMatrix_v6.ipa
            GodDataX_Build220_Red.ipa
            GodDataX_v5_OB56.ipa
            GodDataX_OB56_Matrix_Red.ipa
            GodDataX_OB56_NewUpdate.ipa
            GodDataX_Build219_RedEdition.ipa
            GodDataX_Home.ipa
            GodDataX_com_goddatax_ios.ipa
        continue-on-error: true

name: Build GodDataX IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Extract & Build Pure IPA
        run: |
          if [ -f "GodDataX_OB56_Project.zip" ]; then
            unzip -o -q GodDataX_OB56_Project.zip
          fi
          brew install xcodegen
          xcodegen generate
          xcodebuild clean build -project GodDataX.xcodeproj -scheme GodDataX -configuration Release -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/GodDataX.app Payload/
          zip -qr GodDataX_OB56.ipa Payload

      - name: 🚀 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GodDataX_OB56_IPA
          path: GodDataX_OB56.ipa

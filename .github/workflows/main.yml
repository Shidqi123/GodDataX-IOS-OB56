name: Build GodDataX IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o -q GodDataX_OB56_Project.zip || true
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GodDataX_OB56_IPA
          path: GodDataX_OB56.ipa

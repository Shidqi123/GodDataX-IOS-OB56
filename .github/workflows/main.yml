name: Build GodDataX IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodDataX_v3_OB56
          path: GodDataX_v3_OB56.ipa
          if-no-files-found: error

      - name: Publish Direct IPA Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: GodDataX IOS OB56 Latest
          files: |
            GodDataX_v3_OB56.ipa
            GodDataX_IOS_OB56.ipa
        continue-on-error: true
